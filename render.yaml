services:
  - type: web
    name: unicomputo
    env: docker
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: unicomputo-db
          property: connectionString

databases:
  - name: unicomputo-db
    databaseName: unicomputo
    plan: free
